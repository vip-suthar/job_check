<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}JobCheck{% endblock %}</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand bg-body-tertiary mb-4">
      <div class="container" style="max-width: 860px">
        <a class="navbar-brand" href="{{ url_for('main.index') }}">JobCheck</a>
        <div class="navbar-nav">
          <a class="nav-link" href="{{ url_for('main.index') }}"
            >Check a posting</a
          >
          <a class="nav-link" href="{{ url_for('main.bulk') }}">Bulk check</a>
          <a class="nav-link" href="{{ url_for('main.history') }}">History</a>
          <a class="nav-link" href="{{ url_for('main.dashboard_view') }}"
            >Dashboard</a
          >
        </div>
      </div>
    </nav>
    <main class="container mb-5" style="max-width: 860px">
      {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
